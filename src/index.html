
<head>
  <meta charset="UTF-8" />
  <title>可可島的黃金戀曲</title>
  <style>
    body {
      margin: 0;
      font-family: "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #3b2418, #8b5a2b);
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    #game {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    #title {
      position: absolute;
      top: 30px;
      left: 40px;
      font-size: 32px;
      font-weight: bold;
      text-shadow: 2px 2px 5px #000;
    }

    #character {
      position: absolute;
      bottom: 210px;
      right: 80px;
      font-size: 120px;
      text-shadow: 4px 4px 10px #000;
    }

    #dialogueBox {
      background: rgba(30, 15, 5, 0.88);
      border-top: 3px solid #d4af37;
      padding: 24px;
      min-height: 170px;
      box-sizing: border-box;
    }

    #speaker {
      font-size: 22px;
      color: #ffd86b;
      margin-bottom: 10px;
      font-weight: bold;
    }

    #text {
      font-size: 20px;
      line-height: 1.7;
      min-height: 70px;
    }

    #choices {
      margin-top: 16px;
    }

    button {
      background: #d4af37;
      color: #2b1607;
      border: none;
      padding: 10px 18px;
      margin: 6px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #ffe28a;
    }

    #status {
      position: absolute;
      top: 20px;
      right: 30px;
      background: rgba(0,0,0,0.45);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    #musicControl {
      position: absolute;
      top: 120px;
      right: 30px;
    }
  </style>
</head>
<body>

<div id="game">
  <div id="title">可可島的黃金戀曲</div>

  <div id="status">
    鄭琰好感度：<span id="alenScore">0</span><br>
    蕭褐好感度：<span id="noahScore">0</span><br>
    許騫譽好感度：<span id="kaiScore">0</span>
  </div>

  <div id="musicControl">
    <button onclick="toggleMusic()" aria-label="音樂">♪</button>
  </div>

  <div id="sparkles" aria-hidden="true"></div>
  <div id="character">🍫</div>

  <div id="dialogueBox">
    <div id="speaker"></div>
    <div id="text"></div>
  </div>
  <div id="choices"></div>
  <form id="nameForm" class="is-hidden">
    <input id="playerNameInput" type="text" maxlength="12" autocomplete="off" placeholder="說出妳的名字">
    <button type="submit">讓森林記住我</button>
  </form>
</div>

<audio id="bgm" loop>
  <source src="../VOICE/802092507.m4a" type="audio/mp4">
</audio>

<script>
  const game = {
    currentScene: "intro",
    playerName: "",
    affection: {
      alen: 0,
      noah: 0,
      kai: 0
    }
  };

  const scenes = {
    intro: {
      background: "url('../PIC/可可莊園.png') center / cover no-repeat",
      character: "",
      speaker: "旁白",
      text: "身為可可愛好者的我，在參觀台灣可可莊園時，意外被一顆從樹上墜落的巨大黃金可可果擊中。",
      choices: [
        { text: "繼續", next: "introAwake" }
      ]
    },

    introAwake: {
      background: "url('../PIC/黃金可可.png') center / cover no-repeat",
      character: "",
      sparkles: true,
      speaker: "旁白",
      text: "當我再次睜開雙眼，映入眼簾的是一片金黃色的可可森林。",
      choices: [
        { text: "環顧四周", next: "introForest" }
      ]
    },

    introForest: {
      background: "url('../PIC/黃金可可.png') center / cover no-repeat",
      character: "",
      sparkles: true,
      speaker: "旁白",
      text: "空氣中瀰漫著濃郁巧克力香氣，遠方矗立著一棵巨大的黃金可可樹。",
      choices: [
        { text: "走向黃金可可樹", next: "introVoice" }
      ]
    },

    introVoice: {
      background: "url('../PIC/黃金可可.png') center / cover no-repeat",
      character: "",
      sparkles: true,
      speaker: "旁白",
      text: "就在此時，一道低沉溫柔的聲音從身後傳來。",
      choices: [
        { text: "繼續", next: "introUnknownVoice" }
      ]
    },

    introUnknownVoice: {
      background: "url('../PIC/黃金可可.png') center / cover no-repeat",
      character: "",
      sparkles: true,
      speaker: "？？？",
      text: "「妳終於來了。」",
      choices: [
        { text: "轉身查看", next: "alenReveal" }
      ]
    },

    alenReveal: {
      background: "linear-gradient(135deg, #3b2a1a, #705438)",
      character: { image: "../PIC/02.png", alt: "鄭琰" },
      speaker: "旁白",
      text: "我轉身，看見一名身穿棕金色長袍的男子。\n\n他是——發酵魔術師【鄭琰】。",
      choices: [
        { text: "繼續", next: "nameRiteGaze" }
      ]
    },

    nameRiteGaze: {
      background: "linear-gradient(135deg, #3b2a1a, #705438)",
      character: { image: "../PIC/02.png", alt: "鄭琰" },
      speaker: "旁白",
      text: "但男子沒有立刻靠近，只是靜靜凝視著我，像是在確認某個久遠預言中的人。",
      choices: [
        { text: "繼續", next: "nameRiteMeaning" }
      ]
    },

    nameRiteMeaning: {
      background: "linear-gradient(135deg, #3b2a1a, #705438)",
      character: { image: "../PIC/02.png", alt: "鄭琰" },
      speaker: "鄭琰",
      text: "在這座森林裡，名字不是單純的稱呼。\n\n名字會決定妳與可可島之間的連結，也會讓這片森林記住妳的存在。",
      choices: [
        { text: "繼續", next: "nameRitePrompt" }
      ]
    },

    nameRitePrompt: {
      background: "linear-gradient(135deg, #3b2a1a, #705438)",
      character: { image: "../PIC/02.png", alt: "鄭琰" },
      speaker: "鄭琰",
      text: "所以，告訴我——\n\n妳的名字是？",
      choices: [],
      nameInput: true,
      next: "nameRiteEcho"
    },

    nameRiteEcho: {
      background: "url('../PIC/黃金可可.png') center / cover no-repeat",
      character: "",
      sparkles: true,
      speaker: "旁白",
      text: "【玩家姓名】。\n\n當我說出這個名字的瞬間，腳邊的金色可可葉微微發亮。\n\n遠方那棵巨大的黃金可可樹，像是聽見了什麼似的，枝葉輕輕搖曳。",
      choices: [
        { text: "繼續", next: "nameRiteWelcome" }
      ]
    },

    nameRiteWelcome: {
      background: "linear-gradient(135deg, #3b2a1a, #705438)",
      character: { image: "../PIC/03.png", alt: "鄭琰" },
      speaker: "鄭琰",
      text: "鄭琰露出一抹溫柔的笑。\n\n「原來如此……」\n\n「那麼，從現在開始，可可島也會記住妳的名字。」\n\n「歡迎來到這裡，【玩家姓名】。」",
      choices: []
    },

    wakeUp: {
      background: "linear-gradient(135deg, #2f4f3f, #c99b3b)",
      character: "✨",
      speaker: "女主角",
      text: "這裡是……哪裡？空氣裡好像有可可的香氣，但這裡絕對不是剛才的莊園。",
      choices: [
        { text: "往森林深處走去", next: "meetAlen" },
        { text: "沿著海岸尋找人影", next: "meetNoah" },
        { text: "調查發光的可可果碎片", next: "meetKai" }
      ]
    },

    meetAlen: {
      background: "linear-gradient(135deg, #3b2a1a, #705438)",
      character: { image: "../PIC/03.png", alt: "鄭琰" },
      speaker: "鄭琰",
      text: "迷路的小姐？這裡是可可島。外來者很少能來到這裡，除非……黃金可可果選中了妳。",
      choices: [
        { text: "繼續", next: "prologueEnd" }
      ]
    },

    prologueEnd: {
      background: "linear-gradient(135deg, #3b2a1a, #705438)",
      character: { image: "../PIC/03.png", alt: "鄭琰" },
      speaker: "旁白",
      text: "黃金可可果的香氣仍在空氣裡流動，而我的命運，也在這一刻悄悄偏離了原本的軌道。",
      choices: [
        { text: "重新開始", next: "intro", effect: resetGame }
      ]
    },

    meetNoah: {
      background: "linear-gradient(135deg, #1f3f5b, #8fc9d9)",
      character: "🎻",
      speaker: "蕭褐",
      text: "妳的眼神像剛磨好的可可粉，有點苦，卻藏著香氣。別害怕，我叫蕭褐。",
      choices: [
        { 
          text: "你說話好奇怪，但我不討厭。", 
          next: "noahGood", 
          effect: () => game.affection.noah += 2 
        },
        { 
          text: "你知道怎麼離開這座島嗎？", 
          next: "commonTruth", 
          effect: () => game.affection.noah += 1 
        }
      ]
    },

    meetKai: {
      background: "linear-gradient(135deg, #382042, #b66ddf)",
      character: { image: "../PIC/01.jpg", alt: "許騫譽" },
      speaker: "許騫譽",
      text: "別碰那碎片。黃金可可果不是祝福，而是封印。妳的到來，代表可可島的危機已經開始了。",
      choices: [
        { 
          text: "封印？請告訴我真相。", 
          next: "kaiGood", 
          effect: () => game.affection.kai += 2 
        },
        { 
          text: "你為什麼知道這麼多？", 
          next: "commonTruth", 
          effect: () => game.affection.kai += 1 
        }
      ]
    },

    alenGood: {
      background: "linear-gradient(135deg, #4c321f, #b98245)",
      character: { image: "../PIC/03.png", alt: "鄭琰" },
      speaker: "鄭琰",
      text: "可靠嗎？呵……那我就負責保護妳吧。畢竟可可島的森林，夜晚可不怎麼溫柔。",
      choices: [
        { text: "和鄭琰一起前往村落", next: "commonTruth" }
      ]
    },

    noahGood: {
      background: "linear-gradient(135deg, #23395b, #7fb3d5)",
      character: "🎻",
      speaker: "蕭褐",
      text: "不討厭就夠了。很多感情，一開始都只是『不討厭』。來吧，我帶妳去聽可可島的歌。",
      choices: [
        { text: "跟著蕭褐前往海邊祭壇", next: "commonTruth" }
      ]
    },

    kaiGood: {
      background: "linear-gradient(135deg, #2a1535, #9255a2)",
      character: { image: "../PIC/01.jpg", alt: "許騫譽" },
      speaker: "許騫譽",
      text: "真相會讓人受傷。但如果妳還是想知道，我會陪妳走到最後。",
      choices: [
        { text: "和許騫譽調查黃金可可果", next: "commonTruth" }
      ]
    },

    commonTruth: {
      background: "linear-gradient(135deg, #1d1d1d, #8b6f2f)",
      character: "🌕",
      speaker: "旁白",
      text: "夜幕降臨，可可島中央的黃金樹開始枯萎。三位男子同時出現在妳面前，他們的身影逐漸被可可香氣包圍。",
      choices: [
        { text: "詢問三人的真正身份", next: "identityReveal" }
      ]
    },

    identityReveal: {
      background: "linear-gradient(135deg, #5c4033, #d4af37)",
      character: "🍫",
      speaker: "三人",
      text: "我們不是普通人。我們是可可豆的化身。鄭琰代表濃郁與守護，蕭褐代表香氣與記憶，許騫譽代表苦味與真相。",
      choices: [
        { text: "我想守護這座島", next: "finalChoice" }
      ]
    },

    finalChoice: {
      background: "linear-gradient(135deg, #2f1b0c, #d4af37)",
      character: "💛",
      speaker: "黃金可可果",
      text: "若要修復可可島的秩序，妳必須選擇一位與妳心意相通的化身，共同喚醒黃金可可果真正的力量。",
      choices: [
        { 
          text: "選擇鄭琰：守護與安定", 
          next: "endingAlen",
          effect: () => game.affection.alen += 3
        },
        { 
          text: "選擇蕭褐：香氣與回憶", 
          next: "endingNoah",
          effect: () => game.affection.noah += 3
        },
        { 
          text: "選擇許騫譽：苦味與真相", 
          next: "endingKai",
          effect: () => game.affection.kai += 3
        }
      ]
    },

    endingAlen: {
      background: "linear-gradient(135deg, #4a2c17, #d19a52)",
      character: { image: "../PIC/03.png", alt: "鄭琰" },
      speaker: "鄭琰",
      text: "妳選擇了我，那我也會選擇妳。從今天開始，我不只守護可可島，也守護妳。",
      choices: [
        { text: "查看結局", next: "result" }
      ]
    },

    endingNoah: {
      background: "linear-gradient(135deg, #1f4e79, #aad8e6)",
      character: "🎻💛",
      speaker: "蕭褐",
      text: "妳的名字，會成為我最珍惜的旋律。即使有一天妳回到原本的世界，我也會記得妳的香氣。",
      choices: [
        { text: "查看結局", next: "result" }
      ]
    },

    endingKai: {
      background: "linear-gradient(135deg, #321047, #b573d1)",
      character: { image: "../PIC/01.jpg", alt: "許騫譽" },
      speaker: "許騫譽",
      text: "妳沒有逃避真相。這樣的妳，比黃金可可果還耀眼。留下來吧，和我一起改寫可可島的命運。",
      choices: [
        { text: "查看結局", next: "result" }
      ]
    },

    result: {
      background: "linear-gradient(135deg, #1b1b1b, #d4af37)",
      character: "🏝️",
      speaker: "系統",
      text: "",
      choices: [
        { text: "重新開始", next: "intro", effect: resetGame }
      ],
      onEnter: showResult
    }
  };

  function renderScene(sceneId) {
    const scene = scenes[sceneId];
    game.currentScene = sceneId;

    if (scene.onEnter) {
      scene.onEnter();
    }

    const gameEl = document.getElementById("game");
    gameEl.style.background = scene.background;
    gameEl.classList.toggle("has-sparkles", Boolean(scene.sparkles));
    const characterEl = document.getElementById("character");
    characterEl.classList.toggle("is-photo", typeof scene.character === "object");
    gameEl.classList.toggle("has-photo", typeof scene.character === "object");

    if (typeof scene.character === "object") {
      characterEl.textContent = scene.character.alt;
      characterEl.style.backgroundImage = `url("${scene.character.image}")`;
    } else {
      characterEl.textContent = scene.character;
      characterEl.style.backgroundImage = "";
    }

    const speakerEl = document.getElementById("speaker");
    speakerEl.textContent = scene.speaker;
    speakerEl.classList.toggle("is-hidden", scene.speaker === "旁白");

    if (sceneId !== "result") {
      document.getElementById("text").textContent = formatText(scene.text);
    }

    const choicesDiv = document.getElementById("choices");
    const nameForm = document.getElementById("nameForm");
    const playerNameInput = document.getElementById("playerNameInput");
    choicesDiv.innerHTML = "";
    nameForm.classList.add("is-hidden");
    playerNameInput.value = "";
    gameEl.onclick = null;
    gameEl.classList.remove("can-advance");
    choicesDiv.classList.remove("is-hidden");

    const advanceChoice = (choice) => {
      startBgm();

      if (choice.effect) {
        choice.effect();
      }

      updateStatus();
      renderScene(choice.next);
    };

    const canTapAdvance = scene.choices.length === 1 && !scene.choices[0].effect;

    if (scene.nameInput) {
      choicesDiv.classList.add("is-hidden");
      nameForm.classList.remove("is-hidden");
      nameForm.onsubmit = (event) => {
        event.preventDefault();
        const name = playerNameInput.value.trim();

        if (!name) {
          playerNameInput.focus();
          return;
        }

        game.playerName = name;
        startBgm();
        renderScene(scene.next);
      };
      window.setTimeout(() => playerNameInput.focus(), 50);
      updateStatus();
      return;
    }

    if (canTapAdvance) {
      choicesDiv.classList.add("is-hidden");
      gameEl.classList.add("can-advance");
      gameEl.onclick = (event) => {
        if (event.target.closest("button, audio")) {
          return;
        }

        advanceChoice(scene.choices[0]);
      };
      updateStatus();
      return;
    }

    scene.choices.forEach(choice => {
      const button = document.createElement("button");
      button.textContent = choice.text;

      button.onclick = () => {
        advanceChoice(choice);
      };

      choicesDiv.appendChild(button);
    });

    updateStatus();
  }

  function updateStatus() {
    document.getElementById("alenScore").textContent = game.affection.alen;
    document.getElementById("noahScore").textContent = game.affection.noah;
    document.getElementById("kaiScore").textContent = game.affection.kai;
  }

  function formatText(text) {
    return text.replaceAll("【玩家姓名】", game.playerName || "我");
  }

  function showResult() {
    const { alen, noah, kai } = game.affection;

    let endingText = "";

    if (alen >= noah && alen >= kai) {
      endingText = "結局：濃郁守護之戀。妳與鄭琰一起重建可可森林，可可島重新恢復生機。";
    } else if (noah >= alen && noah >= kai) {
      endingText = "結局：香氣記憶之戀。妳與蕭褐喚醒島上的古老旋律，讓失落的記憶回到人們心中。";
    } else {
      endingText = "結局：苦甜真相之戀。妳與許騫譽揭開黃金可可果的封印，讓可可島迎來真正的自由。";
    }

    document.getElementById("text").textContent = endingText;
  }

  function resetGame() {
    game.affection.alen = 0;
    game.affection.noah = 0;
    game.affection.kai = 0;
    game.playerName = "";
  }

  function startBgm() {
    const bgm = document.getElementById("bgm");

    if (bgm.paused) {
      bgm.volume = 0.8;
      bgm.play().catch(() => {});
    }
  }

  function toggleMusic() {
    const bgm = document.getElementById("bgm");

    if (bgm.paused) {
      bgm.volume = 0.8;
      bgm.play();
    } else {
      bgm.pause();
    }
  }

  renderScene("intro");

  document.addEventListener("pointerdown", startBgm, { once: true });
  document.addEventListener("touchstart", startBgm, { once: true });
</script>

</body>
</html>
